<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Как давно</title>
<meta name="theme-color" content="#f6f1e9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Как давно">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #f6f1e9;
    --card: #fffdf9;
    --ink: #2f2a25;
    --muted: #8a8077;
    --line: #e8dfd3;
    --accent: #c8643b;
    --accent-soft: #f3dfd3;
    --fresh: #5f8a5a;
    --mid: #c9952f;
    --old: #c0553a;
    --radius: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 calc(110px + env(safe-area-inset-bottom)); min-height: 100vh; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  input { font: inherit; color: inherit; }

  header { display: flex; align-items: center; justify-content: space-between;
    padding: 18px 20px 6px; max-width: 640px; margin: 0 auto; }
  h1 { font-size: 30px; margin: 0; letter-spacing: -0.5px; }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    background: var(--card); border: 1px solid var(--line); font-size: 18px; }

  .search { max-width: 640px; margin: 8px auto 4px; padding: 0 16px; }
  .search input { width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); font-size: 16px; outline: none; }

  main { max-width: 640px; margin: 0 auto; padding: 8px 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 14px 14px 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px;
    border-left: 6px solid var(--c, var(--fresh)); }
  .card-main { flex: 1; min-width: 0; }
  .card-name { font-size: 17px; font-weight: 600; margin: 0 0 3px; overflow-wrap: anywhere; }
  .card-sub { font-size: 13px; color: var(--muted); }
  .ago { text-align: right; min-width: 64px; }
  .ago b { display: block; font-size: 24px; line-height: 1; color: var(--c, var(--fresh)); }
  .ago span { font-size: 12px; color: var(--muted); }
  .done-btn { padding: 9px 11px; border-radius: 12px; background: var(--accent-soft); color: var(--accent);
    font-size: 14px; font-weight: 600; white-space: nowrap; }

  .empty { text-align: center; color: var(--muted); padding: 60px 20px; line-height: 1.5; }
  .empty b { display: block; font-size: 40px; margin-bottom: 8px; }

  .fab { position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(22px + env(safe-area-inset-bottom)); background: var(--accent); color: #fff;
    padding: 15px 26px; border-radius: 30px; font-size: 17px; font-weight: 600;
    box-shadow: 0 6px 20px rgba(200,100,59,.35); }

  .overlay { position: fixed; inset: 0; background: rgba(40,30,20,.35); display: none; z-index: 10; }
  .overlay.open { display: block; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); z-index: 11;
    border-radius: 22px 22px 0 0; padding: 10px 18px calc(22px + env(safe-area-inset-bottom));
    max-width: 640px; margin: 0 auto; max-height: 88vh; overflow-y: auto;
    transform: translateY(105%); transition: transform .22s ease; }
  .sheet.open { transform: translateY(0); }
  .grab { width: 40px; height: 5px; background: var(--line); border-radius: 3px; margin: 0 auto 12px; }
  .sheet h2 { margin: 0 0 14px; font-size: 21px; overflow-wrap: anywhere; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
  .field { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); font-size: 17px; outline: none; }
  .field:focus { border-color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
  .chip { padding: 7px 12px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); font-size: 14px; }
  .date-row { display: flex; gap: 7px; margin-top: 8px; }
  .date-row .chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .hint { font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 18px; }
  .primary { width: 100%; margin-top: 18px; padding: 15px; border-radius: 14px; background: var(--accent);
    color: #fff; font-size: 17px; font-weight: 600; }
  .primary:disabled { opacity: .45; }
  .secondary { width: 100%; margin-top: 10px; padding: 13px; border-radius: 14px; background: var(--card);
    border: 1px solid var(--line); font-size: 16px; }
  .danger { color: var(--old); }

  .hist { list-style: none; padding: 0; margin: 0; }
  .hist li { display: flex; justify-content: space-between; align-items: center; padding: 11px 2px;
    border-bottom: 1px solid var(--line); font-size: 16px; }
  .hist li small { color: var(--muted); margin-left: 6px; }
  .del { color: var(--muted); font-size: 20px; padding: 0 6px; }
  .stat { font-size: 14px; color: var(--muted); margin: -6px 0 14px; }

  .tabs { max-width: 640px; margin: 6px auto 4px; padding: 0 16px; }
  .seg { display: flex; background: #ebe3d7; border-radius: 12px; padding: 3px; }
  .seg button { flex: 1; padding: 8px; border-radius: 9px; font-size: 15px; color: var(--muted); }
  .seg button.on { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.08); }

  #cal { max-width: 640px; margin: 0 auto; padding: 8px 16px; }
  .cal-top { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 10px; }
  .cal-top h3 { margin: 0; font-size: 19px; text-transform: capitalize; }
  .cal-top button { width: 38px; height: 38px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); font-size: 18px; }
  .filter { width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card);
    font-size: 16px; margin-bottom: 10px; -webkit-appearance: none; appearance: none; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .wd { text-align: center; font-size: 12px; color: var(--muted); padding-bottom: 2px; }
  .day { aspect-ratio: 1 / 1.08; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 4px 3px; display: flex; flex-direction: column; align-items: center; font-size: 14px; position: relative; }
  .day.out { visibility: hidden; }
  .day.today { border-color: var(--accent); }
  .day.today .num { color: var(--accent); font-weight: 700; }
  .day.sel { background: var(--accent-soft); border-color: var(--accent); }
  .day.hit { background: var(--accent); border-color: var(--accent); color: #fff; }
  .day.hit .num { color: #fff; }
  .dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; margin-top: auto; padding-bottom: 2px; max-width: 100%; }
  .dot { width: 6px; height: 6px; border-radius: 50%; }
  .more { font-size: 10px; color: var(--muted); line-height: 6px; }
  .day-panel { margin-top: 14px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
  .day-panel h4 { margin: 0 0 6px; font-size: 16px; }
  .day-panel .hist li { font-size: 15px; padding: 9px 2px; }
  .day-panel .hist li:last-child { border-bottom: 0; }
  .tag { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; }
  .muted { color: var(--muted); font-size: 14px; padding: 6px 0; }

  .toast { position: fixed; left: 50%; transform: translateX(-50%) translateY(150%);
    bottom: calc(90px + env(safe-area-inset-bottom)); background: var(--ink); color: #fff;
    padding: 11px 16px; border-radius: 14px; font-size: 15px; display: flex; gap: 14px; align-items: center;
    transition: transform .2s ease, opacity .2s ease; z-index: 20; max-width: 92vw;
    opacity: 0; pointer-events: none; }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; pointer-events: auto; }
  .toast button { color: #ffc9a8; font-weight: 600; }
</style>
</head>
<body>

<header>
  <h1>Как давно</h1>
  <button class="icon-btn" id="settingsBtn" aria-label="Настройки">⚙︎</button>
</header>

<div class="tabs">
  <div class="seg">
    <button id="tabList" class="on">Список</button>
    <button id="tabCal">Календарь</button>
  </div>
</div>

<div id="listView">
  <div class="search" id="searchWrap" hidden>
    <input id="search" type="search" placeholder="Найти дело…" autocomplete="off">
  </div>
  <main id="list"></main>
</div>

<section id="cal" hidden>
  <div class="cal-top">
    <button id="prevM" aria-label="Предыдущий месяц">‹</button>
    <h3 id="monthTitle"></h3>
    <button id="nextM" aria-label="Следующий месяц">›</button>
  </div>
  <select class="filter" id="calFilter"></select>
  <div class="grid" id="calGrid"></div>
  <div class="day-panel" id="dayPanel"></div>
</section>

<button class="fab" id="addBtn">＋ Записать</button>

<div class="overlay" id="overlay"></div>

<!-- Добавление -->
<div class="sheet" id="addSheet">
  <div class="grab"></div>
  <h2>Что сделала?</h2>
  <label for="nameInput">Дело</label>
  <input class="field" id="nameInput" placeholder="Например: помыла холодильник" autocomplete="off" enterkeyhint="done">
  <div class="chips" id="suggest"></div>
  <div class="hint" id="nameHint"></div>
  <label>Когда</label>
  <div class="date-row">
    <button class="chip" data-shift="0">Сегодня</button>
    <button class="chip" data-shift="1">Вчера</button>
    <button class="chip" data-shift="2">Позавчера</button>
  </div>
  <input class="field" id="dateInput" type="date" style="margin-top:9px">
  <button class="primary" id="saveBtn" disabled>Сохранить</button>
</div>

<!-- История дела -->
<div class="sheet" id="histSheet">
  <div class="grab"></div>
  <h2 id="histTitle"></h2>
  <div class="stat" id="histStat"></div>
  <ul class="hist" id="histList"></ul>
  <button class="secondary" id="renameBtn">Переименовать</button>
  <button class="secondary danger" id="deleteTaskBtn">Удалить дело целиком</button>
</div>

<!-- Настройки -->
<div class="sheet" id="setSheet">
  <div class="grab"></div>
  <h2>Резервная копия</h2>
  <div class="stat">Записи хранятся на этом устройстве. Время от времени сохраняй копию в файл, чтобы ничего не потерять.</div>
  <button class="secondary" id="exportBtn">Сохранить копию в файл</button>
  <button class="secondary" id="importBtn">Загрузить из файла</button>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
</div>

<div class="toast" id="toast"><span id="toastText"></span><button id="toastUndo">Отменить</button></div>

<script>
(() => {
  const KEY = 'kakdavno.v1';
  const $ = id => document.getElementById(id);

  // ---------- данные ----------
  let entries = [];
  try { entries = JSON.parse(localStorage.getItem(KEY) || '{}').entries || []; } catch (e) { entries = []; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ entries })); } catch (e) { alert('Не удалось сохранить: ' + e.message); } };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const norm = s => s.trim().replace(/\s+/g, ' ').toLowerCase().replace(/ё/g, 'е');
  const clean = s => s.trim().replace(/\s+/g, ' ');

  // ---------- даты ----------
  const pad = n => String(n).padStart(2, '0');
  const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const fromISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
  const shiftDays = n => { const d = today(); d.setDate(d.getDate() - n); return toISO(d); };
  const daysSince = iso => Math.round((today() - fromISO(iso)) / 86400000);
  const MONTHS = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  const fmtDate = iso => { const d = fromISO(iso); const y = d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''; return `${d.getDate()} ${MONTHS[d.getMonth()]}${y}`; };

  const plural = (n, one, few, many) => {
    const a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    if (b === 1) return one;
    return many;
  };
  // большое число + подпись для карточки
  function agoParts(days) {
    if (days < 0) return [fmtDate(shiftDays(days)), 'впереди'];
    if (days === 0) return ['сегодня', ''];
    if (days === 1) return ['вчера', ''];
    if (days < 31) return [days, plural(days, 'день', 'дня', 'дней')];
    if (days < 365) { const m = Math.floor(days / 30.44); return [m, plural(m, 'месяц', 'месяца', 'месяцев')]; }
    const y = Math.floor(days / 365.25); return [y, plural(y, 'год', 'года', 'лет')];
  }
  // мягкая подсветка: свежее — зелёное, давнее — тёплое
  const ageColor = d => d <= 7 ? 'var(--fresh)' : d <= 30 ? 'var(--mid)' : 'var(--old)';

  // ---------- группировка ----------
  function tasks() {
    const map = new Map();
    for (const e of entries) {
      const k = norm(e.name);
      if (!map.has(k)) map.set(k, { key: k, name: e.name, list: [] });
      map.get(k).list.push(e);
    }
    const out = [...map.values()];
    for (const t of out) {
      t.list.sort((a, b) => b.date.localeCompare(a.date) || b.created - a.created);
      t.last = t.list[0];
      t.name = t.last.name;
    }
    // сверху то, что делалось давнее всего
    out.sort((a, b) => a.last.date.localeCompare(b.last.date) || a.name.localeCompare(b.name, 'ru'));
    return out;
  }
  const findTask = key => tasks().find(t => t.key === key);

  // ---------- главный экран ----------
  const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function render() { renderList(); renderCal(); }

  function renderList() {
    const all = tasks();
    $('searchWrap').hidden = all.length < 8;
    const q = norm($('search').value || '');
    const list = q ? all.filter(t => t.key.includes(q)) : all;
    if (!all.length) {
      $('list').innerHTML = `<div class="empty"><b>🗓</b>Пока пусто.<br>Нажми «Записать» и добавь первое дело —<br>например, «помыла голову».</div>`;
      return;
    }
    if (!list.length) { $('list').innerHTML = `<div class="empty">Ничего не нашлось</div>`; return; }
    $('list').innerHTML = list.map(t => {
      const d = daysSince(t.last.date);
      const [big, small] = agoParts(d);
      const n = t.list.length;
      return `<div class="card" style="--c:${ageColor(d)}" data-key="${esc(t.key)}">
        <div class="card-main" data-open>
          <p class="card-name">${esc(t.name)}</p>
          <div class="card-sub">${fmtDate(t.last.date)} · ${n} ${plural(n, 'раз', 'раза', 'раз')}</div>
        </div>
        <div class="ago" data-open><b style="${typeof big === 'string' ? 'font-size:17px' : ''}">${big}</b><span>${small}</span></div>
        <button class="done-btn" data-done>✓ Сегодня</button>
      </div>`;
    }).join('');
  }

  $('list').addEventListener('click', e => {
    const card = e.target.closest('.card'); if (!card) return;
    const t = findTask(card.dataset.key); if (!t) return;
    if (e.target.closest('[data-done]')) {
      const entry = { id: uid(), name: t.name, date: toISO(today()), created: Date.now() };
      entries.push(entry); save(); render();
      toast(`«${t.name}» — отмечено сегодня`, () => { entries = entries.filter(x => x.id !== entry.id); save(); render(); });
    } else if (e.target.closest('[data-open]')) {
      openHistory(t.key);
    }
  });
  $('search').addEventListener('input', render);

  // ---------- шторки ----------
  let openSheet = null;
  function open(id) { close(); $('toast').classList.remove('show'); openSheet = $(id); $('overlay').classList.add('open'); openSheet.classList.add('open'); }
  function close() { if (openSheet) openSheet.classList.remove('open'); $('overlay').classList.remove('open'); openSheet = null; }
  $('overlay').addEventListener('click', close);

  // ---------- добавление ----------
  function setDate(iso) {
    $('dateInput').value = iso;
    document.querySelectorAll('.date-row .chip').forEach(c => c.classList.toggle('active', shiftDays(+c.dataset.shift) === iso));
  }
  function refreshSuggest() {
    const v = norm($('nameInput').value);
    const all = tasks().slice().sort((a, b) => b.last.date.localeCompare(a.last.date));
    const match = all.filter(t => !v || t.key.includes(v)).slice(0, 8);
    $('suggest').innerHTML = match.filter(t => t.key !== v).map(t => `<button class="chip" data-name="${esc(t.name)}">${esc(t.name)}</button>`).join('');
    const exact = all.find(t => t.key === v);
    const dv = $('dateInput').value;
    $('nameHint').textContent = !v ? '' : !exact ? 'Новое дело'
      : dv && dv < exact.last.date
        ? `Уже есть — последний раз ${fmtDate(exact.last.date)}. Эта дата раньше, она добавится в историю, отсчёт не изменится.`
        : `Уже есть — последний раз ${fmtDate(exact.last.date)}. Отсчёт начнётся заново.`;
    $('saveBtn').disabled = !v || !$('dateInput').value;
  }
  function openAdd(iso, name = '') {
    $('nameInput').value = name; setDate(iso); refreshSuggest(); open('addSheet');
    if (!name) setTimeout(() => $('nameInput').focus(), 250);
  }
  $('addBtn').addEventListener('click', () => {
    // в календаре — на выбранный день, в списке — на сегодня
    const iso = view === 'cal' && selDay <= toISO(today()) ? selDay : toISO(today());
    const f = view === 'cal' && calFilter ? findTask(calFilter) : null;
    openAdd(iso, f ? f.name : '');
  });
  $('nameInput').addEventListener('input', refreshSuggest);
  $('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('nameInput').blur(); } });
  $('suggest').addEventListener('click', e => {
    const c = e.target.closest('[data-name]'); if (!c) return;
    $('nameInput').value = c.dataset.name; refreshSuggest();
  });
  document.querySelector('.date-row').addEventListener('click', e => {
    const c = e.target.closest('[data-shift]'); if (c) { setDate(shiftDays(+c.dataset.shift)); refreshSuggest(); }
  });
  $('dateInput').addEventListener('change', () => { setDate($('dateInput').value); refreshSuggest(); });
  $('saveBtn').addEventListener('click', () => {
    const raw = clean($('nameInput').value), date = $('dateInput').value;
    if (!raw || !date) return;
    const existing = findTask(norm(raw));
    const entry = { id: uid(), name: existing ? existing.name : raw, date, created: Date.now() };
    entries.push(entry); save(); close(); render();
    toast(`Записано: «${entry.name}»`, () => { entries = entries.filter(x => x.id !== entry.id); save(); render(); });
  });

  // ---------- история ----------
  let histKey = null;
  function openHistory(key) { histKey = key; fillHistory(); open('histSheet'); }
  function fillHistory() {
    const t = findTask(histKey); if (!t) { close(); render(); return; }
    $('histTitle').textContent = t.name;
    const dates = t.list.map(e => e.date);
    let stat = `${t.list.length} ${plural(t.list.length, 'раз', 'раза', 'раз')}`;
    if (dates.length > 1) {
      const gaps = []; for (let i = 0; i < dates.length - 1; i++) gaps.push((fromISO(dates[i]) - fromISO(dates[i + 1])) / 86400000);
      const avg = Math.round(gaps.reduce((a, b) => a + b, 0) / gaps.length);
      stat += ` · в среднем раз в ${avg} ${plural(avg, 'день', 'дня', 'дней')}`;
    }
    $('histStat').textContent = stat;
    $('histList').innerHTML = t.list.map(e => {
      const d = daysSince(e.date);
      const ago = d === 0 ? 'сегодня' : d === 1 ? 'вчера' : d > 0 ? `${d} ${plural(d, 'день', 'дня', 'дней')} назад` : '';
      return `<li><span>${fmtDate(e.date)}<small>${ago}</small></span><button class="del" data-id="${e.id}" aria-label="Удалить">×</button></li>`;
    }).join('');
  }
  $('histList').addEventListener('click', e => {
    const b = e.target.closest('[data-id]'); if (!b) return;
    const removed = entries.find(x => x.id === b.dataset.id);
    entries = entries.filter(x => x.id !== b.dataset.id); save(); render(); fillHistory();
    toast('Запись удалена', () => { entries.push(removed); save(); render(); if (histKey) fillHistory(); });
  });
  $('renameBtn').addEventListener('click', () => {
    const t = findTask(histKey); if (!t) return;
    const v = prompt('Новое название', t.name); if (v === null) return;
    const name = clean(v); if (!name) return;
    const target = findTask(norm(name));
    if (target && target.key !== t.key && !confirm(`Дело «${target.name}» уже есть. Объединить записи?`)) return;
    const finalName = target && target.key !== t.key ? target.name : name;
    entries.forEach(e => { if (norm(e.name) === t.key) e.name = finalName; });
    save(); histKey = norm(finalName); render(); fillHistory();
  });
  $('deleteTaskBtn').addEventListener('click', () => {
    const t = findTask(histKey); if (!t) return;
    if (!confirm(`Удалить «${t.name}» и все ${t.list.length} ${plural(t.list.length, 'запись', 'записи', 'записей')}?`)) return;
    const removed = entries.filter(e => norm(e.name) === t.key);
    entries = entries.filter(e => norm(e.name) !== t.key); save(); close(); render();
    toast(`«${t.name}» удалено`, () => { entries.push(...removed); save(); render(); });
  });

  // ---------- календарь ----------
  let view = 'list';
  let calMonth = new Date(today().getFullYear(), today().getMonth(), 1);
  let selDay = toISO(today());
  let calFilter = '';   // ключ дела или '' = все дела
  const MONTH_NAMES = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
  const MONTHS_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  const WD = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'];
  const WD_FULL = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
  const PALETTE = ['#c8643b', '#5f8a5a', '#4f7fa8', '#c9952f', '#9a5fa0', '#3f9a93', '#b9506d', '#7a6a55', '#6d7fd1', '#8aa83e'];
  const colorOf = key => { let h = 0; for (const c of key) h = (h * 31 + c.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; };

  function setView(v) {
    view = v;
    $('tabList').classList.toggle('on', v === 'list');
    $('tabCal').classList.toggle('on', v === 'cal');
    $('listView').hidden = v !== 'list';
    $('cal').hidden = v !== 'cal';
    render();
  }
  $('tabList').addEventListener('click', () => setView('list'));
  $('tabCal').addEventListener('click', () => setView('cal'));

  function renderCal() {
    if (view !== 'cal') return;
    const all = tasks().slice().sort((a, b) => a.name.localeCompare(b.name, 'ru'));
    if (calFilter && !all.some(t => t.key === calFilter)) calFilter = '';
    $('calFilter').innerHTML = `<option value="">Все дела</option>` +
      all.map(t => `<option value="${esc(t.key)}"${t.key === calFilter ? ' selected' : ''}>${esc(t.name)}</option>`).join('');

    // записи по дням
    const byDay = new Map();
    for (const e of entries) {
      if (calFilter && norm(e.name) !== calFilter) continue;
      if (!byDay.has(e.date)) byDay.set(e.date, []);
      byDay.get(e.date).push(e);
    }

    const y = calMonth.getFullYear(), m = calMonth.getMonth();
    $('monthTitle').textContent = `${MONTH_NAMES[m]} ${y}`;
    const first = (new Date(y, m, 1).getDay() + 6) % 7;     // понедельник = 0
    const count = new Date(y, m + 1, 0).getDate();
    const todayISO = toISO(today());
    let html = WD.map(w => `<div class="wd">${w}</div>`).join('');
    for (let i = 0; i < first; i++) html += `<div class="day out"></div>`;
    for (let d = 1; d <= count; d++) {
      const iso = `${y}-${pad(m + 1)}-${pad(d)}`;
      const list = byDay.get(iso) || [];
      const cls = ['day'];
      if (iso === todayISO) cls.push('today');
      if (calFilter && list.length) cls.push('hit');
      if (iso === selDay) cls.push('sel');
      let marks = '';
      if (!calFilter && list.length) {
        const keys = [...new Set(list.map(e => norm(e.name)))];
        marks = `<div class="dots">${keys.slice(0, 4).map(k => `<span class="dot" style="background:${colorOf(k)}"></span>`).join('')}${keys.length > 4 ? `<span class="more">+${keys.length - 4}</span>` : ''}</div>`;
      }
      html += `<button class="${cls.join(' ')}" data-day="${iso}"><span class="num">${d}</span>${marks}</button>`;
    }
    $('calGrid').innerHTML = html;

    // панель выбранного дня
    const sd = fromISO(selDay);
    const dayList = (byDay.get(selDay) || []).slice().sort((a, b) => a.name.localeCompare(b.name, 'ru'));
    let panel = `<h4>${sd.getDate()} ${MONTHS_GEN[sd.getMonth()]}, ${WD_FULL[sd.getDay()]}</h4>`;
    panel += dayList.length
      ? `<ul class="hist">${dayList.map(e => `<li><span><span class="tag" style="background:${colorOf(norm(e.name))}"></span>${esc(e.name)}</span><button class="del" data-id="${e.id}" aria-label="Удалить">×</button></li>`).join('')}</ul>`
      : `<div class="muted">В этот день ничего не записано</div>`;
    if (calFilter) {
      const prefix = `${y}-${pad(m + 1)}`;
      const inMonth = [...byDay.keys()].filter(k => k.startsWith(prefix)).length;
      const monthPrep = MONTHS_GEN[m].slice(0, -1) + 'е';   // ноября → ноябре
      panel += `<div class="muted">«${esc(findTask(calFilter).name)}» в ${monthPrep}: ${inMonth} ${plural(inMonth, 'раз', 'раза', 'раз')}</div>`;
    }
    $('dayPanel').innerHTML = panel;
  }

  $('calGrid').addEventListener('click', e => {
    const b = e.target.closest('[data-day]'); if (!b) return;
    selDay = b.dataset.day; renderCal();
  });
  $('calFilter').addEventListener('change', e => { calFilter = e.target.value; renderCal(); });
  const shiftMonth = n => {
    calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + n, 1);
    const t = today();
    selDay = calMonth.getFullYear() === t.getFullYear() && calMonth.getMonth() === t.getMonth() ? toISO(t) : toISO(calMonth);
    renderCal();
  };
  $('prevM').addEventListener('click', () => shiftMonth(-1));
  $('nextM').addEventListener('click', () => shiftMonth(1));
  // свайп влево/вправо по календарю — смена месяца
  let tx = null;
  $('calGrid').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
  $('calGrid').addEventListener('touchend', e => {
    if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null;
    if (Math.abs(dx) > 60) shiftMonth(dx < 0 ? 1 : -1);
  });
  $('dayPanel').addEventListener('click', e => {
    const b = e.target.closest('[data-id]'); if (!b) return;
    const removed = entries.find(x => x.id === b.dataset.id);
    entries = entries.filter(x => x.id !== b.dataset.id); save(); render();
    toast('Запись удалена', () => { entries.push(removed); save(); render(); });
  });

  // ---------- резервная копия ----------
  $('settingsBtn').addEventListener('click', () => open('setSheet'));
  $('exportBtn').addEventListener('click', async () => {
    const json = JSON.stringify({ app: 'kak-davno', version: 1, exported: new Date().toISOString(), entries }, null, 2);
    const fname = `kak-davno-${toISO(today())}.json`;
    const file = new File([json], fname, { type: 'application/json' });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: fname }); return; }
    } catch (e) { if (e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = fname; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });
  $('importBtn').addEventListener('click', () => $('importFile').click());
  $('importFile').addEventListener('change', async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      const list = (data.entries || []).filter(x => x && x.name && /^\d{4}-\d{2}-\d{2}$/.test(x.date));
      if (!list.length) { alert('В файле нет записей'); return; }
      const ids = new Set(entries.map(x => x.id));
      const add = list.filter(x => !ids.has(x.id)).map(x => ({ id: x.id || uid(), name: clean(x.name), date: x.date, created: x.created || Date.now() }));
      entries.push(...add); save(); close(); render();
      alert(`Добавлено записей: ${add.length}` + (add.length < list.length ? ` (ещё ${list.length - add.length} уже были)` : ''));
    } catch (err) { alert('Не получилось прочитать файл: ' + err.message); }
  });

  // ---------- уведомление с отменой ----------
  let toastTimer, undoFn;
  function toast(text, undo) {
    $('toastText').textContent = text; undoFn = undo;
    $('toastUndo').style.display = undo ? '' : 'none';
    $('toast').classList.add('show'); clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $('toast').classList.remove('show'), 4000);
  }
  $('toastUndo').addEventListener('click', () => { if (undoFn) undoFn(); undoFn = null; $('toast').classList.remove('show'); });

  // пересчитать, когда возвращаешься в приложение (например, на следующий день)
  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

  render();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
